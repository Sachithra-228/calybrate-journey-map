<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calybrate Journey Map</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" id="brand" aria-label="Calybrate journey map"><img src="assets/logo.png" alt="Calybrate" height="34"></a>

  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search any step — try “launch”, “52C” or “CSV”" autocomplete="off" aria-label="Search steps">
    <kbd>/</kbd>
    <div class="results" id="results" hidden></div>
  </div>

  <input type="file" id="file-import" accept="application/json" hidden>
</header>

<main>
  <div class="stage" id="stage" tabindex="0" aria-label="Calybrate journey map. Drag to move, scroll to zoom."></div>

  <div class="caption" id="caption" aria-live="polite"></div>

  <div class="legend" id="legend">
    <b>Status</b>
    <span><i class="lg todo"></i>Not started</span>
    <span><i class="lg doing"></i>In progress</span>
    <span><i class="lg blocked"></i>Blocked</span>
    <span><i class="lg done"></i>Done</span>
  </div>

  <div class="toolbar" id="toolbar"></div>
  <div class="minimap" id="minimap"><svg id="mm" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="hint" id="hint">Drag to move &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Click a chapter to open it</div>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h3>What's happened so far</h3>
    <button class="btn ghost icon-only" id="d-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="d-tabs" id="d-tabs">
    <button data-f="all" class="on">All</button><button data-f="comment">Comments</button><button data-f="status">Status</button>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-bar">
    <strong id="lb-title"></strong>
    <div>
      <button class="btn ghost" id="lb-prev">‹</button>
      <button class="btn ghost" id="lb-next">›</button>
      <button class="btn ghost" id="lb-rot">Rotate</button>
      <button class="btn ghost" id="lb-close">Close</button>
    </div>
  </div>
  <div class="lb-stage"><img id="lb-img" alt="Original sketch"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
